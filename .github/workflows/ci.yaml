name: CI

on:
  push:
    branches: [ main ]
    tags: [ v*.*.* ]

  pull_request:
    branches: [ main ]
    types:
      - synchronize
      - opened
      - reopened

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [ armhf, arm64, amd64 ]
        distribution: [ trixie ]
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Checkout with token
        uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ github.token }}

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v3

      - name: Build Project
        uses: devcontainers/ci@v0.3
        with:
          subFolder: "${{ github.workspace }}"
          configFile: .devcontainer/${{ matrix.architecture }}-${{ matrix.distribution }}-container/devcontainer.json
          push: never
          runCmd: |
            if [ ${{ matrix.architecture }} == "amd64" ]; then
              sudo apt update && sudo apt install -y libsodium-dev libzmq-drafts
              
              PACKAGE=$(sudo PIP_NO_BINARY=pyzmq ZMQ_DRAFT_API=1 pack_python . -s fpm-deb)
            
              sudo apt install -y ${PACKAGE}
              
              # check if drafts are enabled outside of pyzmq project
              cd .. && bash pyzmq/check_drafts.sh
            else
              WORKSPACE=$(pwd)
              BUILDROOT="/var/chroot/buildroot"
              
              sudo rsync -av --exclude ".git" --exclude ".*cache" --mkpath ${WORKSPACE}/ ${BUILDROOT}${WORKSPACE}/
              
              sudo schroot -p -c buildroot -- apt update
              sudo schroot -p -c buildroot -- apt install -y libsodium-dev libzmq-drafts packaging-tools
              
              PACKAGE=$(sudo PIP_NO_BINARY=pyzmq ZMQ_DRAFT_API=1 schroot -p -c buildroot -- pack_python . -s fpm-deb)
              
              sudo schroot -p -c buildroot -- apt install -y ${PACKAGE}
            
              # check if drafts are enabled outside of pyzmq project
              sudo schroot -p -c buildroot -d /workspaces -- bash pyzmq/check_drafts.sh
              
              sudo mkdir -p $(dirname ${PACKAGE})
              sudo cp ${BUILDROOT}${PACKAGE} ${PACKAGE}
            fi
            
            sudo mv -vf ${PACKAGE} $(dirname ${PACKAGE})/${{ matrix.distribution }}_$(basename ${PACKAGE})

      - name: Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/')}}
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.*deb

name: CI

on:
  push:
    branches: [ main ]
    tags: [ v*.*.* ]

  pull_request:
    branches: [ main ]
    types:
      - synchronize
      - opened
      - reopened

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [ arm64 ]
        distribution: [ trixie ]
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Checkout with token
        uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ github.token }}

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v3

      - name: Build Project
        uses: devcontainers/ci@v0.3
        with:
          subFolder: "${{ github.workspace }}"
          configFile: .devcontainer/${{ matrix.architecture }}-${{ matrix.distribution }}-container/devcontainer.json
          push: never
          runCmd: |
            set -e
            
            sudo apt update && sudo apt install -y libsodium-dev libzmq-drafts
            
            sudo PIP_NO_BINARY=pyzmq ZMQ_DRAFT_API=1 pack_python . -s fpm-deb

            for package in $(find dist -name *.deb)
            do
              sudo apt install -y ./$package
            
              sudo mv -vf $package $(dirname $package)/${{ matrix.distribution }}_$(basename $package)
            done
            
            cd ..
            bash pyzmq/check_drafts.sh

      - name: Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/')}}
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.*deb
